<div class="options-header">
  <h1>Options</h1>
  <div class="header-actions">
    <button mat-stroked-button (click)="openBulkImportDialog()">
      <mat-icon>upload</mat-icon>
      Bulk Import
    </button>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Add Option
    </button>
  </div>
</div>

<div class="options-toolbar">
  <app-option-search (searchChange)="onSearchChange($event)" />
  <mat-form-field appearance="outline" class="sort-field">
    <mat-label>Sort by</mat-label>
    <mat-select [value]="sortKey()" (selectionChange)="onSortChange($event.value)">
      <mat-option value="recent">Recently Created</mat-option>
      <mat-option value="name">Name (A&ndash;Z)</mat-option>
      <mat-option value="popularity">Popularity</mat-option>
    </mat-select>
  </mat-form-field>
</div>

@if (loading()) {
  <div class="loading-container">
    <mat-spinner diameter="48" />
  </div>
} @else {
  @if (options().length === 0) {
    <div class="empty-state">
      <mat-icon class="empty-icon">inventory_2</mat-icon>
      <p>No options found. Create one to get started.</p>
    </div>
  } @else {
    <div class="options-list">
      @for (option of options(); track option.id) {
        <app-option-card
          [option]="option"
          (edit)="openEditDialog($event)"
          (delete)="confirmDelete($event)" />
      }
    </div>
  }
}
